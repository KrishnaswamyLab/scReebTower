[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-reeb-tower"
version = "0.1.0"
description = "Discrete Reeb graphs from point clouds and affinity graphs via diffusion filters."
readme = "README.md"
# TODO: choose a license with the lab, add a LICENSE file, and set e.g. license = "MIT"
authors = [
    { name = "Zack Warren" },
    # TODO: add co-authors / Krishnaswamy Lab
]
requires-python = ">=3.8"
keywords = ["reeb graph", "topological data analysis", "single-cell", "diffusion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "numba>=0.56",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5",
    "networkx>=2.6",
]
test = [
    "pytest>=7",
    "matplotlib>=3.5",
    "networkx>=2.6",
]

[project.urls]
Homepage = "https://github.com/KrishnaswamyLab/scReebTower"
Source = "https://github.com/KrishnaswamyLab/scReebTower"
Issues = "https://github.com/KrishnaswamyLab/scReebTower/issues"

[tool.setuptools.packages.find]
where = ["src"]
